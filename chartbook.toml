[project]
name = "News Headlines"
description = "Curate news headlines data from various sources"
contributors = [
    "Jeremiah Bejarano",
]
repo_url = "https://github.com/finm-33200/news_headlines"
copyright = "2025"
os_compatibility = [
    "Windows",
    "Linux",
    "MacOS",
]
requires_chartbook = ">=0.5.0"

[scripts]
build = "doit"

[notebooks.01_data_sources_overview]
description = "Pipeline motivation, data source comparison, and summary statistics for each dataset."
path = "_output/01_data_sources_overview_ipynb.ipynb"

[notebooks.02_gdelt_sp500_filtering]
description = "Filtering funnel, false positive analysis, and full data lake coverage for GDELT S&P 500 headlines."
path = "_output/02_gdelt_sp500_filtering_ipynb.ipynb"

[notebooks.03_crosswalk_quality]
description = "Match rates, score distribution, and coverage for the newswire-to-RavenPack headline crosswalk."
path = "_output/03_crosswalk_quality_ipynb.ipynb"

[dataframes.gdelt_headlines]
name = "GDELT Headlines"
description = "GDELT GKG headlines for English articles mentioning organizations. Hive-partitioned by year and month, covering Feb 2015 onward."
sources = [
    "GDELT Global Knowledge Graph",
]
providers = [
    "GDELT Project",
]
provider_links = [
    "https://www.gdeltproject.org",
]
tags = [
    "Headlines",
    "GDELT",
]
access_types = [
    "Free (BigQuery)",
]
pull_method = "SQL queries via Google BigQuery pulling all English GDELT GKG records with organization mentions and page titles."
path = "_data/gdelt_headlines/**/*.parquet"
docs_path = "docs_src/dataframes/gdelt_headlines.md"

[dataframes.newswire_headlines]
name = "Newswire Headlines"
description = "Free newswire headlines scraped from PR Newswire via sitemap crawling. Hive-partitioned by source, year, month, and day."
sources = [
    "PR Newswire",
]
providers = [
    "PR Newswire",
]
provider_links = [
    "https://www.prnewswire.com",
]
tags = [
    "Headlines",
    "Newswire",
    "Press Releases",
]
access_types = [
    "Free (web scraping)",
]
pull_method = "Python sitemap crawler extracts headlines and metadata from PR Newswire XML sitemaps."
path = "_data/newswire_headlines/**/*.parquet"
docs_path = "docs_src/dataframes/newswire_headlines.md"

[dataframes.scraped_headlines_with_rp_metadata]
name = "Scraped Headlines with RavenPack Metadata"
description = "Merged dataset joining scraped headlines (newswire + GDELT) with full RavenPack metadata via fuzzy-match crosswalks. Use 'headline' column for downstream NLP."
sources = [
    "PR Newswire",
    "GDELT GKG",
    "RavenPack DJ Press Releases",
]
providers = [
    "PR Newswire",
    "GDELT Project",
    "RavenPack",
]
provider_links = [
    "https://www.prnewswire.com",
    "https://www.gdeltproject.org",
    "https://www.ravenpack.com",
]
tags = [
    "Headlines",
    "NLP",
    "Sentiment",
    "S&P 500",
]
access_types = [
    "Free (web scraping)",
    "Free (BigQuery)",
    "Licensed (WRDS)",
]
pull_method = "Newswire headlines scraped via sitemap crawling; GDELT queried via BigQuery; RavenPack accessed via WRDS. Crosswalks built by fuzzy-matching scraped headlines to RavenPack."
path = "_data/scraped_headlines_with_rp_metadata.parquet"
docs_path = "docs_src/dataframes/scraped_headlines_with_rp_metadata.md"

[charts.rp_match_rate_coverage]
name = "Daily RavenPack Match Rate"
description = "Percentage of RavenPack headlines matched by scraped sources (newswire + GDELT) each day."
dataframe = "scraped_headlines_with_rp_metadata"
tags = [
    "Coverage",
    "RavenPack",
    "Crosswalk",
    "Headlines",
]
start_date = "2015-02-01"
frequency = "Daily"
observation_period = "End of day"
release_lag = "1 day"
release_timing = "Next business day"
seasonal_adjustment = "None"
units = "Percent"
path = "_output/rp_match_rate_coverage.html"
docs_path = "docs_src/charts/rp_match_rate_coverage.md"
